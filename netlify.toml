[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# v7.80: fingerprinted public images only (SHA-256 in filenames).
# Does not apply to HTML, login/payment endpoints or generated JS.
[[headers]]
  for = "/assets/embedded-v780/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# v7.84.1: Only the explicitly generated dist/ files are publicly served.
# Keep source QA reports, translation CSVs, and server-only answer keys outside publish.

# v7.89.5: PWA should revalidate its update script on phone launches.
# The service worker still excludes navigation/auth/API responses from cache.
[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache, max-age=0, must-revalidate"

# v7.90.2 QA-only account setup: static source, no credential caching.
[[headers]]
  for = "/assets/qa-identity-setup-v7902.html"
  [headers.values]
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Content-Security-Policy = "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; frame-ancestors 'none'"
