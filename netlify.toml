[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# v7.80: fingerprinted public images only (SHA-256 in filenames).
# Does not apply to HTML, login/payment endpoints or generated JS.
[[headers]]
  for = "/assets/embedded-v780/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# v7.84.1: Only the explicitly generated dist/ files are publicly served.
# Keep source QA reports, translation CSVs, and server-only answer keys outside publish.
