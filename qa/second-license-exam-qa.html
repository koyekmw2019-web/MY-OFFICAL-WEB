<script type="application/json" id="questionData">{"version":"v7.89.0-rc.1-coverage2","type":"ordinary_second","originalItems":[{"id":"N001","type":"text","category":"traffic","answer":true,"jp":"歩行者が横断歩道を渡ろうとしているときは、手前で一時停止して通行を妨げない。","mm":"လူကူးမျဉ်းကျားကို လမ်းလျှောက်သူ ဖြတ်ကူးတော့မည်ဆိုလျှင် မျဉ်းကျားမတိုင်မီ ရပ်ပြီး လမ်းပေးရသည်။","explanationJP":"停止線があればその直前、なければ横断歩道の直前で一時停止します。","explanationMM":"ရပ်မျဉ်းရှိလျှင် ရပ်မျဉ်းမတိုင်မီ၊ မရှိလျှင် လူကူးမျဉ်းကျားမတိုင်မီ ရပ်ပါ။","chapter":5},{"id":"N002","type":"text","category":"traffic","answer":false,"jp":"見通しの悪い交差点では、警音器を鳴らせば安全確認を省略できる。","mm":"မြင်ကွင်းကွယ်နေတဲ့ လမ်းဆုံမှာ ဟွန်းတီးရုံနဲ့ လုံခြုံရေးမစစ်လည်းရတယ်။","explanationJP":"警音器だけでは安全確認の代わりになりません。","explanationMM":"ဟွန်းတီးရုံနဲ့ အန္တရာယ်ကင်းကြောင်း မသေချာပါ။","chapter":5},{"id":"N003","type":"text","category":"traffic","answer":true,"jp":"青信号でも、前方の渋滞で交差点内に止まり、交差する道路の車の通行を妨げるおそれがあるときは、交差点に入ってはいけない。","mm":"မီးစိမ်းနေလည်း ရှေ့မှာကားပိတ်နေ၍ လမ်းဆုံထဲတွင် ရပ်မိပြီး ကန့်လန့်ဖြတ်လမ်းမှ ယာဉ်များကို ပိတ်ဆို့နိုင်လျှင် လမ်းဆုံထဲ မဝင်ရပါ။","explanationJP":"交差点内で停止し、他の交通を妨げることを避けます。","explanationMM":"လမ်းဆုံကို မပိတ်မိအောင် ရှောင်ရပါတယ်။","chapter":5},{"id":"N004","type":"text","category":"traffic","answer":false,"jp":"一時停止の標識がある場所では、周囲に車がなければ徐行だけで通過してよい。","mm":"ရပ်ရန်အမှတ်အသားရှိရင် ကားမရှိသရွေ့ ဖြည်းဖြည်းမောင်းပြီး ဖြတ်လို့ရတယ်။","explanationJP":"一時停止の指定場所では停止が必要です。","explanationMM":"ရပ်ရန်သတ်မှတ်ထားတဲ့နေရာမှာ ရပ်ရပါတယ်။","chapter":1},{"id":"N005","type":"text","category":"traffic","answer":true,"jp":"右左折するときは、歩行者や自転車の動きを確認して安全に曲がる。","mm":"ညာဘယ်ကွေ့ရာမှာ လူနဲ့ စက်ဘီးတွေကိုစစ်ပြီး ကွေ့ရပါတယ်။","explanationJP":"巻き込み事故を防ぐため、周囲の確認が必要です。","explanationMM":"တိုက်မိမှုကာကွယ်ဖို့ ပတ်ဝန်းကျင်စစ်ရပါတယ်။","chapter":5},{"id":"N006","type":"text","category":"traffic","answer":false,"jp":"黄色信号になったら、停止できる状況でも必ず加速して交差点へ入る。","mm":"မီးဝါလာရင် ရပ်လို့ရလည်း အမြဲအရှိန်တိုးပြီး လမ်းဆုံဝင်ရမယ်။","explanationJP":"安全に停止できるときは停止します。","explanationMM":"လုံခြုံစွာရပ်နိုင်ရင် ရပ်ရပါတယ်။","chapter":1},{"id":"N007","type":"text","category":"traffic","answer":true,"jp":"交差点で警察官が交通整理をしている場合は、その指示に従う。","mm":"လမ်းဆုံမှာ ရဲညွှန်ကြားနေရင် သူ့ညွှန်ကြားချက်လိုက်နာရပါတယ်။","explanationJP":"警察官の交通整理に従います。","explanationMM":"ရဲ၏ ယာဉ်ကြောညွှန်ကြားချက်ကို လိုက်နာရပါတယ်။","chapter":1},{"id":"N008","type":"text","category":"traffic","answer":false,"jp":"進路変更の合図を出せば、後方の安全を確認せずに車線を変えてよい。","mm":"ကွေ့အချက်ပြမီး ပြထားလျှင် နောက်ဘက်ကို မစစ်ဘဲ ယာဉ်ကြောပြောင်းလို့ ရသည်။","explanationJP":"合図に加えて安全確認が必要です。","explanationMM":"မီးပြရုံမက နောက်ကိုလည်း စစ်ရပါတယ်။","chapter":5},{"id":"N009","type":"text","category":"traffic","answer":true,"jp":"最高速度が標識で指定されている道路では、その速度を超えて走ってはいけない。","mm":"ဆိုင်းဘုတ်ဖြင့် အမြင့်ဆုံးအမြန်နှုန်း သတ်မှတ်ထားပါက ထိုနှုန်းကို ကျော်၍ မမောင်းရပါ။","explanationJP":"指定された最高速度を超えてはいけません。","explanationMM":"သတ်မှတ်ထားတဲ့ အမြန်နှုန်းထက် မကျော်ရပါ။","chapter":5},{"id":"N010","type":"text","category":"traffic","answer":false,"jp":"前の車が急に止まっても対応できるように、車間距離はできるだけ短くする。","mm":"ရှေ့ကားရုတ်တရက်ရပ်ရင် ပြန်တုံ့ပြန်နိုင်အောင် ကားအကွာအဝေးကို နည်းနည်းထားသင့်တယ်။","explanationJP":"十分な車間距離を取ることが必要です。","explanationMM":"ကားအကြား လုံလောက်တဲ့အကွာအဝေးထားရပါတယ်။","chapter":5},{"id":"N011","type":"text","category":"traffic","answer":true,"jp":"路面に停止線がある場合は、必要な停止をその線の直前で行う。","mm":"ရပ်မျဉ်းရှိသောနေရာတွင် ရပ်ရန်လိုအပ်ပါက မျဉ်းကို မကျော်မီ မျဉ်းကပ်လျက် ရပ်ရသည်။","explanationJP":"停止線を越えて停止してはいけません。","explanationMM":"ရပ်မျဉ်းကို ကျော်ပြီးမရပ်ရပါ။","chapter":1},{"id":"N012","type":"text","category":"traffic","answer":false,"jp":"安全地帯があれば、歩行者が近くにいてもその中を走行してよい。","mm":"လူတွေရှိနေလည်း လုံခြုံရေးကျွန်းထဲကို ကားဝင်မောင်းနိုင်တယ်။","explanationJP":"安全地帯への進入は認められません。","explanationMM":"လူအတွက် လုံခြုံရေးကျွန်းထဲ ကားမဝင်ရပါ။","chapter":5},{"id":"N013","type":"text","category":"traffic","answer":true,"jp":"信号機のない踏切では、踏切の直前（停止線があるときはその直前）で一時停止し、安全を確かめてから進む。","mm":"ယာဉ်ကြောမီးပွိုင့်မရှိသော ရထားလမ်းကူးနေရာတွင် ရထားလမ်းမတိုင်မီ (ရပ်မျဉ်းရှိလျှင် ရပ်မျဉ်းမတိုင်မီ) ရပ်ပြီး လုံခြုံကြောင်း စစ်ဆေးမှ ဖြတ်ကူးရသည်။","explanationJP":"信号機の信号に従って進む場合には、一時停止の例外があります。警報機と信号機は別です。","explanationMM":"ယာဉ်ကြောမီးပွိုင့်၏ အချက်ပြအတိုင်း ဖြတ်ကူးသည့်အခါ မဖြစ်မနေရပ်ရမည့် စည်းမျဉ်း၌ ခြွင်းချက်ရှိသည်။ ရထားလာကြောင်း သတိပေးစက်သည် ယာဉ်ကြောမီးပွိုင့်နှင့် မတူပါ။","chapter":6},{"id":"N014","type":"text","category":"traffic","answer":false,"jp":"渋滞で車が並んでいれば、横断歩道上に停車してもよい。","mm":"ကားပိတ်နေရင် လူကူးမျဉ်းပေါ် ရပ်နေလို့ရတယ်။","explanationJP":"横断歩道をふさいではいけません。","explanationMM":"လူကူးမျဉ်းကို မပိတ်ရပါ။","chapter":5},{"id":"N015","type":"text","category":"safety","answer":true,"jp":"雨の降り始めは路面が滑りやすいことがあるため、早めに減速する。","mm":"မိုးစရွာချိန် လမ်းချော်နိုင်လို့ အရှိန်စောလျှော့ရပါတယ်။","explanationJP":"濡れた路面では制動距離が延びる場合があります。","explanationMM":"လမ်းစိုရင် ဘရိတ်အကွာအဝေးရှည်နိုင်ပါတယ်။","chapter":6},{"id":"N017","type":"text","category":"safety","answer":true,"jp":"カーブに入る前には、道路状況に応じて十分に速度を落とす。","mm":"ကွေ့မဝင်ခင် လမ်းအခြေအနေအလိုက် အရှိန်လျှော့ရပါတယ်။","explanationJP":"カーブ中の急操作は危険です。","explanationMM":"ကွေ့နေချိန် ရုတ်တရက်ထိန်းချုပ်မှုက အန္တရာယ်ရှိပါတယ်။","chapter":6},{"id":"N018","type":"text","category":"safety","answer":false,"jp":"眠気を感じても、窓を開ければ休憩せず運転を続けてよい。","mm":"အိပ်ငိုက်နေရင် ပြတင်းပေါက်ဖွင့်ပြီး မနားဘဲဆက်မောင်းလို့ရတယ်။","explanationJP":"眠気があるときは安全な場所で休息します。","explanationMM":"အိပ်ငိုက်ရင် လုံခြုံရာနေရာမှာ နားရပါတယ်။","chapter":4},{"id":"N019","type":"text","category":"safety","answer":true,"jp":"前方に停車車両があるときは、その陰から人が出る可能性を考える。","mm":"ရှေ့မှာရပ်ထားတဲ့ကားနောက်က လူထွက်လာနိုင်တာကို စဉ်းစားရပါတယ်။","explanationJP":"死角にいる歩行者に注意します。","explanationMM":"ကားကွယ်ရာက လူထွက်လာနိုင်တာကို သတိထားရပါတယ်။","chapter":5},{"id":"N021","type":"text","category":"safety","answer":true,"jp":"車の死角を意識し、発進前に周囲の安全を確認する。","mm":"ကားမြင်ကွယ်နေရာကို စဉ်းစားပြီး မထွက်ခင် စစ်ရပါတယ်။","explanationJP":"ミラーだけで見えない場所もあります。","explanationMM":"မှန်မှာမမြင်ရတဲ့ နေရာတွေလည်းရှိပါတယ်။","chapter":4},{"id":"N022","type":"text","category":"safety","answer":false,"jp":"ブレーキの効きがいつもと違っても、走れれば点検しなくてよい。","mm":"ဘရိတ်ပုံမှန်မဟုတ်ပေမဲ့ မောင်းလို့ရရင် မစစ်လည်းရတယ်။","explanationJP":"制動装置の異常は重大な事故につながります。","explanationMM":"ဘရိတ်ချို့ယွင်းရင် ပြင်းထန်တဲ့မတော်တဆမှုဖြစ်နိုင်ပါတယ်။","chapter":4},{"id":"N023","type":"text","category":"safety","answer":true,"jp":"長時間運転では、疲労をためないよう適切に休憩を取る。","mm":"အချိန်ကြာမောင်းရင် ပင်ပန်းမှုမစုအောင် နားရပါတယ်။","explanationJP":"疲労は判断力や注意力を低下させます。","explanationMM":"ပင်ပန်းမှုက သတိနဲ့ဆုံးဖြတ်နိုင်စွမ်းကို လျော့စေပါတယ်။","chapter":4},{"id":"N025","type":"text","category":"safety","answer":true,"jp":"周囲に子どもがいる場所では、急な飛び出しに備えて運転する。","mm":"ကလေးရှိတဲ့နေရာမှာ ရုတ်တရက်ပြေးထွက်နိုင်တာကို သတိထားရပါတယ်။","explanationJP":"子どもの行動は予測しにくい場合があります。","explanationMM":"ကလေးတွေ ရုတ်တရက်လှုပ်ရှားနိုင်ပါတယ်။","chapter":5},{"id":"N026","type":"text","category":"safety","answer":false,"jp":"タイヤの空気圧が極端に低くても、燃料が入っていれば通常どおり走ってよい。","mm":"တာယာလေဖိအား အရမ်းနည်းလည်း ဆီရှိရင် ပုံမှန်မောင်းလို့ရတယ်။","explanationJP":"タイヤの異常は操縦安定性に影響します。","explanationMM":"တာယာလေဖိအား မမှန်လျှင် ကားကို တည်ငြိမ်အောင် ထိန်းမောင်းရခက်နိုင်သည်။","chapter":4},{"id":"N027","type":"text","category":"safety","answer":true,"jp":"急な割り込みを受けたときは、感情的にならず安全な距離を確保する。","mm":"ကားဖြတ်ဝင်လာရင် စိတ်မဆိုးဘဲ လုံခြုံတဲ့အကွာအဝေးထားရပါတယ်။","explanationJP":"危険を拡大させない冷静な対応が必要です。","explanationMM":"အန္တရာယ်မတိုးအောင် စိတ်အေးအေးထားရပါတယ်။","chapter":1},{"id":"N029","type":"text","category":"passenger","answer":true,"jp":"旅客を乗せる前に、停車場所の周囲に危険がないか確認する。","mm":"ခရီးသည်မတင်မီ ရပ်တဲ့နေရာပတ်လည်မှာ အန္တရာယ်ရှိမရှိ စစ်ရပါတယ်။","explanationJP":"乗降場所の安全確認は旅客保護の基本です。","explanationMM":"တက်ဆင်းနေရာလုံခြုံမှုစစ်ခြင်းက အရေးကြီးပါတယ်။","chapter":9},{"id":"N030","type":"text","category":"passenger","answer":false,"jp":"乗客が急いでいると頼んだ場合は、安全確認を省いて発進してよい。","mm":"ခရီးသည်အလျင်လိုတယ်ပြောရင် လုံခြုံရေးမစစ်ဘဲ ထွက်လို့ရတယ်။","explanationJP":"旅客の希望より安全確認を優先します。","explanationMM":"ခရီးသည်ဆန္ဒထက် လုံခြုံရေးက အရေးကြီးပါတယ်။","chapter":9},{"id":"N031","type":"text","category":"passenger","answer":true,"jp":"乗客の体調が悪そうなときは、安全に配慮し必要な対応を考える。","mm":"ခရီးသည်မကျန်းမာသလိုထင်ရင် လုံခြုံရေးစဉ်းစားပြီး ကူညီရပါတယ်။","explanationJP":"旅客の状況に応じた配慮が必要です。","explanationMM":"ခရီးသည်အခြေအနေအလိုက် ဂရုစိုက်ရပါတယ်။","chapter":9},{"id":"N032","type":"text","category":"passenger","answer":false,"jp":"旅客への説明は運転の妨げになるため、状況を尋ねられても常に無視してよい。","mm":"ခရီးသည်မေးခွန်းက မောင်းနှင်မှုအနှောင့်အယှက်ဖြစ်လို့ အမြဲမဖြေရဘူး။","explanationJP":"安全を保ちながら適切に案内する姿勢が大切です。","explanationMM":"လုံခြုံရေးထိန်းပြီး လိုအပ်သလို ရှင်းပြသင့်ပါတယ်။","chapter":9},{"id":"N033","type":"text","category":"passenger","answer":true,"jp":"乗客が降りる際は、後方から近づく自転車などにも注意する。","mm":"ခရီးသည်ဆင်းရာမှာ နောက်ကလာတဲ့စက်ဘီးတွေကို သတိထားရပါတယ်။","explanationJP":"ドア開放時の接触事故を防ぎます。","explanationMM":"တံခါးဖွင့်ချိန်တိုက်မိမှုကို ကာကွယ်ရပါတယ်။","chapter":9},{"id":"N034","type":"text","category":"passenger","answer":false,"jp":"高齢の乗客が乗るときも、すべての乗客に同じ速さで乗車を求めればよい。","mm":"အသက်ကြီးသူကိုလည်း လူတိုင်းလိုပဲ အမြန်တက်ခိုင်းလို့ရတယ်။","explanationJP":"乗客の状態に応じた時間と配慮が必要です。","explanationMM":"ခရီးသည်အခြေအနေအလိုက် အချိန်ပေးရပါတယ်။","chapter":9},{"id":"N035","type":"text","category":"passenger","answer":true,"jp":"荷物の置き方が危険な場合は、発進前に安全な状態を確かめる。","mm":"ပစ္စည်းထားပုံအန္တရာယ်ရှိရင် မထွက်ခင် ပြင်ဆင်စစ်ရပါတယ်။","explanationJP":"転倒や運転妨害を防ぐためです。","explanationMM":"ပစ္စည်းလဲကျမှု၊ မောင်းနှင်မှုအနှောင့်အယှက်ကို ကာကွယ်ရပါတယ်။","chapter":4},{"id":"N036","type":"text","category":"passenger","answer":false,"jp":"乗客が座り終える前でも、後続車が待っていれば直ちに急発進する。","mm":"ခရီးသည်မထိုင်ရသေးလည်း နောက်ကားစောင့်ရင် ချက်ချင်းအရှိန်နဲ့ထွက်ရမယ်။","explanationJP":"乗客の転倒防止を優先します。","explanationMM":"ခရီးသည်လဲကျမှုကို ကာကွယ်ရပါတယ်။","chapter":9},{"id":"N037","type":"text","category":"passenger","answer":true,"jp":"乗客の忘れ物に気付いたら、定められた取扱いに従って対応する。","mm":"ခရီးသည်ပစ္စည်းမေ့ခဲ့ရင် သတ်မှတ်လုပ်ထုံးလုပ်နည်းအတိုင်း ဆောင်ရွက်ရပါတယ်။","explanationJP":"忘れ物は適切に管理・報告します。","explanationMM":"မေ့ကျန်ပစ္စည်းကို စည်းကမ်းအတိုင်း ကိုင်တွယ်ရပါတယ်။","chapter":9},{"id":"N039","type":"text","category":"passenger","answer":true,"jp":"乗客の安全を守るため、発車前にドアの閉鎖状態を確かめる。","mm":"ခရီးသည်လုံခြုံဖို့ မထွက်ခင် တံခါးပိတ်ထားတာ စစ်ရပါတယ်။","explanationJP":"開いたドアは転落などの危険があります。","explanationMM":"တံခါးဖွင့်နေရင် ပြုတ်ကျနိုင်ပါတယ်။","chapter":9},{"id":"N040","type":"text","category":"passenger","answer":false,"jp":"運転中に客からスマートフォンの画面を見せられたら、前方より画面を優先して見る。","mm":"မောင်းနေတုန်း ခရီးသည်ဖုန်းပြရင် ရှေ့လမ်းထက်ဖုန်းကို ဦးစားပေးကြည့်ရတယ်။","explanationJP":"運転中は前方と周囲の安全確保を優先します。","explanationMM":"မောင်းနေတုန်း ရှေ့လမ်းကို ဦးစားပေးရပါတယ်။","chapter":9},{"id":"N041","type":"text","category":"passenger","answer":true,"jp":"乗客が不安を感じるほどの急加速や急減速を避け、滑らかに運転する。","mm":"ခရီးသည်မကြောက်အောင် ရုတ်တရက်အရှိန်တိုး/လျှော့တာ ရှောင်ရပါတယ်။","explanationJP":"急操作は旅客の転倒・負傷につながります。","explanationMM":"ရုတ်တရက်မောင်းလို့ ခရီးသည်ဒဏ်ရာရနိုင်ပါတယ်။","chapter":9},{"id":"N044","type":"text","category":"professional","answer":false,"jp":"旅客を乗せていない回送中は、交通法規を守らなくてもよい。","mm":"ခရီးသည်မတင်ဘဲ နေရာပြောင်းမောင်းနှင်နေချိန်တွင် ယာဉ်စည်းကမ်း မလိုက်နာလည်းရသည်။","explanationJP":"回送中も道路交通法に従います。","explanationMM":"ခရီးသည်မပါလည်း လမ်းစည်းကမ်းလိုက်နာရပါတယ်။","chapter":9},{"id":"N045","type":"text","category":"professional","answer":true,"jp":"出発前に運転者自身の体調を確認し、不調があれば適切に対応する。","mm":"မထွက်ခင် ကိုယ့်ကျန်းမာရေးစစ်ပြီး မကောင်းရင် လိုအပ်သလိုလုပ်ရပါတယ်။","explanationJP":"体調不良は旅客の安全にも影響します。","explanationMM":"ကျန်းမာရေးမကောင်းရင် ခရီးသည်လုံခြုံရေးထိခိုက်နိုင်ပါတယ်။","chapter":4},{"id":"N047","type":"text","category":"professional","answer":true,"jp":"運転前にミラーや座席位置を調整して、安全に操作できる状態にする。","mm":"မောင်းမီ မှန်နဲ့ထိုင်ခုံကို လုံခြုံစွာထိန်းနိုင်အောင် ပြင်ရပါတယ်။","explanationJP":"適切な運転姿勢と視野を確保します。","explanationMM":"မှန်ကန်တဲ့အနေအထားနဲ့ မြင်ကွင်းရဖို့ပါ။","chapter":4},{"id":"N048","type":"text","category":"professional","answer":false,"jp":"走行中、客から店の予約を頼まれたら、運転者が携帯電話を手に持って店に電話してよい。","mm":"မောင်းနေစဉ် ခရီးသည်က ဆိုင်တွင် ကြိုတင်စာရင်းသွင်းပေးရန် တောင်းဆိုလျှင် ယာဉ်မောင်းက ဖုန်းကို လက်ဖြင့်ကိုင်ပြီး ဆိုင်သို့ ဖုန်းဆက်လို့ရသည်။","explanationJP":"走行中の手持ち通話は原則禁止です。店の予約は緊急やむを得ない通話には当たりません。","explanationMM":"မောင်းနေစဉ် ဖုန်းကို လက်ဖြင့်ကိုင်၍ ပြောဆိုခြင်းကို ယေဘုယျအားဖြင့် တားမြစ်ထားသည်။ ဆိုင်သို့ ကြိုတင်စာရင်းပေးခြင်းသည် မလွှဲမရှောင်သာသော အရေးပေါ်ခေါ်ဆိုမှု မဟုတ်ပါ။","chapter":5},{"id":"N050","type":"text","category":"professional","answer":false,"jp":"タクシーの運転者は、交通ルールよりも乗客の希望する経路を優先してよい。","mm":"တက္ကစီယာဉ်မောင်းက လမ်းစည်းကမ်းထက် ခရီးသည်လိုချင်တဲ့လမ်းကို ဦးစားပေးနိုင်တယ်။","explanationJP":"旅客の希望も交通法規の範囲内で対応します。","explanationMM":"ခရီးသည်ဆန္ဒလည်း ဥပဒေအတွင်းမှာပဲ လိုက်နာရပါတယ်။","chapter":9},{"id":"N051","type":"text","category":"professional","answer":true,"jp":"車両に故障の疑いがある場合は、乗客を危険にさらさないよう対応する。","mm":"ကားချို့ယွင်းမယ်ထင်ရင် ခရီးသည်အန္တရာယ်မဖြစ်အောင် ဆောင်ရွက်ရပါတယ်။","explanationJP":"不具合を無視した運行は危険です。","explanationMM":"ချို့ယွင်းမှုမစစ်ဘဲဆက်မောင်းတာ အန္တရာယ်ရှိပါတယ်။","chapter":9},{"id":"N052","type":"text","category":"professional","answer":false,"jp":"運転中に道に迷った場合は、急停車や急な進路変更を繰り返してよい。","mm":"လမ်းပျောက်ရင် ရုတ်တရက်ရပ်/လမ်းကြောင်းပြောင်းတာ ခဏခဏလုပ်လို့ရတယ်။","explanationJP":"安全な場所で経路を確認します。","explanationMM":"လုံခြုံတဲ့နေရာမှာ လမ်းကြောင်းပြန်စစ်ရပါတယ်။","chapter":9},{"id":"N054","type":"text","category":"professional","answer":false,"jp":"安全を確保できない場所でも、乗客が指定した位置に必ず停車する。","mm":"မလုံခြုံတဲ့နေရာလည်း ခရီးသည်ပြောတဲ့နေရာမှာ မဖြစ်မနေရပ်ရမယ်။","explanationJP":"安全で適法な場所への停車を選びます。","explanationMM":"လုံခြုံပြီး ဥပဒေနဲ့ကိုက်တဲ့နေရာကို ရွေးရပါတယ်။","chapter":9},{"id":"N056","type":"text","category":"boarding","answer":false,"jp":"客を降ろす場所では、後方確認をせずに急に道路へ寄せてよい。","mm":"ခရီးသည်ချမယ့်နေရာမှာ နောက်မကြည့်ဘဲ ရုတ်တရက်ကပ်ရပ်လို့ရတယ်။","explanationJP":"合図と安全確認をしてから停車します。","explanationMM":"မီးပြပြီး နောက်စစ်မှ ရပ်ရပါတယ်။","chapter":5},{"id":"N058","type":"text","category":"boarding","answer":false,"jp":"目的地に着いたら、車が完全に止まる前にドアを開けてよい。","mm":"ရောက်တဲ့အခါ ကားလုံးဝမရပ်ခင် တံခါးဖွင့်လို့ရတယ်။","explanationJP":"完全停止してから安全に乗降させます。","explanationMM":"ကားလုံးဝရပ်ပြီးမှ တက်ဆင်းစေရပါတယ်။","chapter":9},{"id":"N059","type":"text","category":"boarding","answer":true,"jp":"道路の形状に応じて乗客が安全に歩道側へ降りられる位置を選ぶ。","mm":"လမ်းအနေအထားကိုကြည့်၍ ခရီးသည်က လူသွားစင်္ကြံဘက်သို့ ဘေးကင်းစွာ ဆင်းနိုင်မည့်နေရာကို ရွေးသည်။","explanationJP":"乗降時の交通事故を防ぐためです。","explanationMM":"တက်ဆင်းချိန်တိုက်မိမှုကာကွယ်ဖို့ပါ။","chapter":9},{"id":"N061","type":"text","category":"boarding","answer":true,"jp":"車いす利用者が乗車するときは、必要な支援や安全な乗降方法を確認する。","mm":"ဘီးတပ်ကုလားထိုင်အသုံးပြုသူကို ကူညီမှုနဲ့ လုံခြုံတဲ့တက်ဆင်းနည်းစစ်ရပါတယ်။","explanationJP":"個々の状況に合った支援が必要です。","explanationMM":"တစ်ယောက်ချင်းအခြေအနေအလိုက် ကူညီဖို့လိုပါတယ်။","chapter":9},{"id":"N062","type":"text","category":"boarding","answer":false,"jp":"雨の日の乗降では、足元が滑りやすくなることを気にしなくてよい。","mm":"မိုးရွာချိန်တက်ဆင်းရာမှာ ခြေချော်တာကို သတိထားစရာမလိုဘူး။","explanationJP":"雨天は足元の安全確認が重要です。","explanationMM":"မိုးရွာရင် ခြေထောက်ချော်နိုင်လို့ စစ်ရပါတယ်။","chapter":9},{"id":"N063","type":"text","category":"boarding","answer":true,"jp":"乗客の手荷物がドアに挟まれていないか注意する。","mm":"ခရီးသည်အိတ်တံခါးညပ်နေမနေ သတိထားရပါတယ်။","explanationJP":"挟み込みはけがや荷物の破損につながります。","explanationMM":"ညပ်မိရင် ဒဏ်ရာနဲ့ပစ္စည်းပျက်နိုင်ပါတယ်။","chapter":9},{"id":"N065","type":"text","category":"boarding","answer":true,"jp":"子どもが乗降するときは、急に道路へ出る可能性も考える。","mm":"ကလေးတက်ဆင်းရာမှာ ရုတ်တရက်လမ်းပေါ်ထွက်နိုင်တာကို သတိထားရပါတယ်။","explanationJP":"子どもの予測しにくい動きに備えます。","explanationMM":"ကလေးရဲ့ ရုတ်တရက်လှုပ်ရှားမှုကို သတိထားရပါတယ်။","chapter":9},{"id":"N067","type":"text","category":"vulnerable","answer":true,"jp":"高齢者が歩く道路では、横断に時間がかかることを考慮する。","mm":"အသက်ကြီးသူလမ်းလျှောက်ရာမှာ ဖြတ်ကူးချိန်ပိုကြာနိုင်တာကို စဉ်းစားရပါတယ်။","explanationJP":"歩行速度には個人差があります。","explanationMM":"လမ်းလျှောက်နှုန်းက လူတစ်ယောက်ချင်းကွာပါတယ်။","chapter":5},{"id":"N068","type":"text","category":"vulnerable","answer":false,"jp":"白杖を持った人を見かけても、車の進行が優先されるので配慮は不要である。","mm":"တုတ်ဖြူကိုင်သူတွေ့လည်း ကားဦးစားပေးလို့ ဂရုမစိုက်လည်းရတယ်။","explanationJP":"白杖を携えて歩く目の見えない人の通行を妨げないよう、一時停止するか徐行します。","explanationMM":"တုတ်ဖြူကိုင်၍ လမ်းလျှောက်နေသော အမြင်အာရုံမသန်စွမ်းသူကို မနှောင့်ယှက်စေရန် ရပ်ပါ သို့မဟုတ် ချက်ချင်းရပ်နိုင်သည့်အမြန်နှုန်းဖြင့် ဖြည်းဖြည်းမောင်းပါ။","chapter":5},{"id":"N070","type":"text","category":"vulnerable","answer":false,"jp":"車いす利用者が近くにいても、車から見えやすいので安全確認を省いてよい。","mm":"ဘီးတပ်ကုလားထိုင ် ပိုနီးနီး မောင်းလို့ရသည်။","explanationJP":"濡れた路面では停止距離が延びることがあります。","explanationMM":"လမ်းစိုရင် ရပ်အကွာအဝေးရှည်နိုင်ပါတယ်။","chapter":6},{"id":"N084","type":"text","category":"weather","answer":false,"jp":"夜間に対向車がまぶしいときは、目を閉じたまま走行する。","mm":"ညဘက် မျက်နှာချင်းဆိုင်မှ လာသောကား၏ မီးရောင်စူးလျှင် မျက်စိမှိတ်ထားလျက် ဆက်မောင်းသည်။","explanationJP":"視線や速度を調整して安全を確保します。","explanationMM":"အမြင်နဲ့အမြန်နှုန်းထိန်းပြီး လုံခြုံစေရပါတယ်။","chapter":6},{"id":"N085","type":"text","category":"weather","answer":true,"jp":"水たまりを通るときは、歩行者への水はねにも気を配る。","mm":"ရေအိုင်ဖြတ်ရာမှာ လူတွေဆီရေစင်တာကို သတိထားရပါတယ်။","explanationJP":"歩行者への迷惑や危険を避けます。","explanationMM":"လူတွေကို ထိခိုက်မှုမဖြစ်အောင် ရှောင်ရပါတယ်။","chapter":5},{"id":"N087","type":"text","category":"weather","answer":true,"jp":"強風時には、車体が横から押される可能性に注意する。","mm":"လေပြင်းတိုက်ရင် ကားကို ဘေးမှတွန်းနိုင်တာ သတိထားရပါတယ်။","explanationJP":"横風で進路が乱れることがあります。","explanationMM":"ဘေးလေကြောင့် လမ်းကြောင်းလွဲနိုင်ပါတယ်။","chapter":6},{"id":"N089","type":"text","category":"weather","answer":true,"jp":"夜間に停車する際は、周囲の車両からの見えやすさを考える。","mm":"ညဘက်ရပ်ရင် အခြားကားတွေမြင်နိုင်မလား စဉ်းစားရပါတယ်။","explanationJP":"後続車との事故防止に役立ちます。","explanationMM":"နောက်ကားနဲ့မတိုက်မိအောင် ကူညီပါတယ်။","chapter":6},{"id":"N091","type":"text","category":"emergency","answer":true,"jp":"事故が起きたときは、まず負傷者の救護と二次事故の防止に努める。","mm":"မတော်တဆဖြစ်ရင် ဒဏ်ရာရသူကယ်ဆယ်ရေးနဲ့ ထပ်မံတိုက်မိမှုကာကွယ်ရပါတယ်။","explanationJP":"直ちに停止し、負傷者を救護して道路上の危険を防ぎ、警察に報告します。","explanationMM":"ချက်ချင်းရပ်ပြီး ဒဏ်ရာရသူကို ကူညီပါ။ လမ်းပေါ်တွင် နောက်ထပ်အန္တရာယ်မဖြစ်အောင် ကာကွယ်ပြီး ရဲထံ သတင်းပို့ပါ။","chapter":10},{"id":"N094","type":"text","category":"emergency","answer":false,"jp":"交通事故の直後、車が動けば安全確認をせずにその場から立ち去ってよい。","mm":"တိုက်မိပြီး ကားမောင်းလို့ရရင် မစစ်ဘဲ ထွက်သွားလို့ရတယ်။","explanationJP":"救護・危険防止・報告などの義務があります。","explanationMM":"ကယ်ဆယ်ခြင်း၊ အန္တရာယ်ကာကွယ်ခြင်း၊ တိုင်ကြားခြင်း တာဝန်ရှိပါတယ်။","chapter":10},{"id":"N095","type":"text","category":"emergency","answer":true,"jp":"車両火災の兆候があるときは、周囲と乗客の安全を最優先に対応する。","mm":"ကားမီးလောင်မယ်ထင်ရင် ခရီးသည်နဲ့ပတ်ဝန်းကျင် လုံခြုံရေးဦးစားပေးရပါတယ်။","explanationJP":"安全な場所への避難が必要になる場合があります。","explanationMM":"လိုအပ်ရင် လုံခြုံရာထွက်ခွာရပါတယ်။","chapter":10},{"id":"N097","type":"text","category":"emergency","answer":true,"jp":"故障で停止する場合は、他車との衝突を防ぐ措置を考える。","mm":"ချို့ယွင်းပြီး ရပ်ရရင် အခြားကားတိုက်မိမှုကာကွယ်ဖို့ စဉ်းစားရပါတယ်။","explanationJP":"停止位置と周囲への注意が必要です。","explanationMM":"ရပ်မယ့်နေရာနဲ့ ပတ်ဝန်းကျင်ကို သတိထားရပါတယ်။","chapter":10},{"id":"N099","type":"text","category":"emergency","answer":true,"jp":"緊急車両が近づいてきた場合は、交通状況に応じた適切な方法で進路を譲る。","mm":"အရေးပေါ်ကားလာရင် လမ်းအခြေအနေအလိုက် လမ်းပေးရပါတယ်။","explanationJP":"緊急車両の通行を妨げないようにします。","explanationMM":"အရေးပေါ်ကားလမ်းကို မပိတ်ရပါ။","chapter":5},{"id":"N102","type":"text","category":"emergency","answer":false,"jp":"パンクした直後は、必ず急ブレーキを最大限かけるのが安全である。","mm":"တာယာပေါက်ချက်ချင်း ဘရိတ်အပြင်းဆုံးအုပ်တာ အမြဲလုံခြုံတယ်။","explanationJP":"急な操作を避け、車両を安定させて安全に減速します。","explanationMM":"ရုတ်တရက်မလုပ်ဘဲ ကားကိုထိန်းပြီး အရှိန်လျှော့ရပါတယ်။","chapter":6},{"id":"N103","type":"text","category":"traffic","chapter":1,"jp":"赤信号でも、青い左向きの矢印が点灯していれば、普通車は安全を確認して左折できる。","mm":"မီးနီနေပေမဲ့ ဘယ်ဘက်သို့ မီးစိမ်းမြားပြထားလျှင် သာမန်ကားသည် ဘေးကင်းကြောင်းစစ်ပြီး ဘယ်ကွေ့နိုင်သည်။","answer":true,"explanationJP":"矢印が示す方向への進行が認められる。","explanationMM":"မြားပြသည့်ဘက်သို့ သွားခွင့်ရှိသည်။"},{"id":"N104","type":"text","category":"traffic","chapter":1,"jp":"黄色の点滅信号では、普通車は必ず一時停止してから進む。","mm":"အဝါရောင်မီး မှိတ်တုတ်ပြလျှင် သာမန်ကားသည် အမြဲတမ်း အရင်ရပ်ပြီးမှ ဆက်သွားရသည်။","answer":false,"explanationJP":"周囲の交通に注意して進むことができる。","explanationMM":"အနီးအနား ယာဉ်နှင့်လူတို့ကို သတိပြုပြီး ဆက်သွားနိုင်သည်။"},{"id":"N105","type":"text","category":"traffic","chapter":1,"jp":"赤の点滅信号に向かうタクシーは、歩行者がいなくても一時停止する。","mm":"မှိတ်တုတ်ပြနေသော မီးနီဆီ ချဉ်းကပ်သည့် တက္ကစီသည် လူမရှိလည်း တစ်ကြိမ် အပြည့်အဝရပ်ရသည်။","answer":true,"explanationJP":"赤の点滅は車に一時停止を求める。","explanationMM":"မှိတ်တုတ်ပြသော မီးနီတွင် ယာဉ်ရပ်ရန် လိုသည်။"},{"id":"N106","type":"text","category":"traffic","chapter":1,"jp":"補助標識に時間帯が示されているときは、本標識と合わせて規制の内容を判断する。","mm":"အောက်ခံဆိုင်းဘုတ်တွင် အချိန်ကာလပြထားလျှင် ပင်မဆိုင်းဘုတ်နှင့် တွဲဖတ်ပြီး ကန့်သတ်ချက်ကို ဆုံးဖြတ်ရသည်။","answer":true,"explanationJP":"補助標識は規制の時間や対象などを示す。","explanationMM":"အောက်ခံဆိုင်းဘုတ်က ကန့်သတ်သည့်အချိန်၊ သက်ဆိုင်သည့်ယာဉ် စသည်တို့ကို ဖော်ပြသည်။"},{"id":"N107","type":"text","category":"traffic","chapter":1,"jp":"車両進入禁止の標識がある入口でも、目的地がすぐ先なら普通車で入れる。","mm":"ယာဉ်ဝင်ခွင့်ပိတ်ထားသည့် လမ်းဝ၌ ခရီးဆုံးက အနီးမှာရှိလျှင် သာမန်ကားဖြင့် ဝင်နိုင်သည်။","answer":false,"explanationJP":"目的地までの距離は進入禁止の例外にならない。","explanationMM":"ခရီးဆုံး နီးခြင်းကြောင့် ဝင်ခွင့်မရပါ။"},{"id":"N108","type":"text","category":"traffic","chapter":1,"jp":"道路に荷箱を置いて通行を妨げても、すぐ取りに戻ればよい。","mm":"လမ်းပေါ် ပစ္စည်းသေတ္တာချထားပြီး သွားလာမှုကို ပိတ်ဆို့သော်လည်း ချက်ချင်းပြန်လာယူလျှင် ရသည်။","answer":false,"explanationJP":"交通の妨害になるような物の置き方をしてはいけない。","explanationMM":"သွားလာမှုကို ပိတ်ဆို့စေမည့်ပုံစံဖြင့် ပစ္စည်းချမထားရပါ။"},{"id":"N109","type":"text","category":"traffic","chapter":1,"jp":"走っている車の窓から空き缶を投げてはいけない。","mm":"မောင်းနေသည့်ကားပြတင်းပေါက်မှ ဘူးခွံ ပစ်မချရပါ။","answer":true,"explanationJP":"後続車や歩行者に危険を及ぼす。","explanationMM":"နောက်ကားနှင့် လမ်းသွားသူများကို အန္တရာယ်ဖြစ်စေနိုင်သည်။"},{"id":"N110","type":"text","category":"traffic","chapter":1,"jp":"警察官が腕を横に水平に伸ばしているとき、その胸に向かって進む車には青信号と同じ意味になる。","mm":"ရဲက လက်ကို ဘေးသို့ အလျားလိုက် ဆန့်ထားလျှင် ရဲ၏ရင်ဘတ်ဆီ ဦးတည်လာသည့်ကားအတွက် မီးစိမ်းနှင့် အဓိပ္ပာယ်တူသည်။","answer":false,"explanationJP":"胸や背中に向かう交通には赤信号と同じ意味になる。","explanationMM":"ရဲ၏ ရှေ့တည့်တည့် သို့မဟုတ် နောက်တည့်တည့်မှ လာလျှင် မီးနီနှင့် တူသည်။"},{"id":"N111","type":"text","category":"traffic","chapter":5,"jp":"対面する信号が青でも、右折する車は対向する直進車の進行を妨げてはいけない。","mm":"ရှေ့မီးပွိုင့် စိမ်းနေလည်း ညာကွေ့မည့်ကားက မျက်နှာချင်းဆိုင်မှ တည့်တည့်လာသော ကားကို မပိတ်ဆို့ရပါ။","answer":true,"explanationJP":"青信号は右折車に優先権を与えるものではない。","explanationMM":"မီးစိမ်းခြင်းက ညာကွေ့ကားကို ဦးစားပေးအခွင့် မပေးပါ။"},{"id":"N112","type":"text","category":"traffic","chapter":5,"jp":"歩道を横切って店の駐車場へ入るときは、歩行者が見えなくても歩道の直前で一時停止する。","mm":"ဆိုင်ကားရပ်ကွင်းထဲဝင်ရန် လူသွားစင်္ကြံကို ဖြတ်ရလျှင် လူမမြင်ရလည်း စင်္ကြံမတိုင်မီ အပြည့်အဝရပ်ရသည်။","answer":true,"explanationJP":"歩道を横断する車には停止と歩行者の保護が求められる。","explanationMM":"စင်္ကြံဖြတ်သည့် ယာဉ်သည် ရပ်ပြီး လမ်းသွားသူကို ကာကွယ်ရသည်။"},{"id":"N113","type":"text","category":"traffic","chapter":5,"jp":"交差点で左折するときは、あらかじめできるだけ道路の左端に寄る。","mm":"လမ်းဆုံတွင် ဘယ်ကွေ့မည်ဆိုလျှင် ကြိုတင်၍ တတ်နိုင်သမျှ လမ်းဘယ်စွန်းသို့ ကပ်ထားရသည်။","answer":true,"explanationJP":"左端に寄り、巻き込みに注意して徐行する。","explanationMM":"ဘယ်စွန်းကပ်ပြီး ဘေးမှယာဉ်ကို ကွေ့တိုက်မိခြင်းမရှိစေရန် ဖြည်းဖြည်းကွေ့ရသည်။"},{"id":"N114","type":"text","category":"traffic","chapter":5,"jp":"右折の合図は、交差点に入ってから出せば間に合う。","mm":"ညာကွေ့မည့် အချက်ပြမီးကို လမ်းဆုံထဲရောက်မှ ပြလည်း အချိန်မီသည်။","answer":false,"explanationJP":"右折する地点の約三十メートル手前で合図を出す。","explanationMM":"ကွေ့မည့်နေရာမတိုင်မီ မီတာ ၃၀ ခန့်အလိုကတည်းက အချက်ပြရသည်။"},{"id":"N115","type":"text","category":"traffic","chapter":5,"jp":"歩行者との安全な間隔を取れない狭い道では、その側を通るときに徐行する。","mm":"လမ်းကျဉ်း၌ လမ်းသွားသူနှင့် ဘေးကင်းလောက်သည့် အကွာအဝေး မထားနိုင်လျှင် သူ့ဘေးမှ ဖြည်းဖြည်းဖြတ်ရသည်။","answer":true,"explanationJP":"歩行者との間隔に応じて通り方を変える。","explanationMM":"လမ်းသွားသူနှင့် ကြားအကွာအဝေးအလိုက် ဖြတ်သန်းပုံကို ပြောင်းရသည်။"},{"id":"N116","type":"text","category":"traffic","chapter":5,"jp":"交差点内で待つ客がいれば、短い乗車のために任意に停車できる。","mm":"လမ်းဆုံထဲတွင် ခရီးသည်စောင့်နေလျှင် ခဏတင်ရန် မိမိဆန္ဒအလျောက် ရပ်နိုင်သည်။","answer":false,"explanationJP":"交差点内は乗客を拾うために停車できる場所ではない。","explanationMM":"လမ်းဆုံထဲတွင် ခရီးသည်တင်ရန် ကားမရပ်ရပါ။"},{"id":"N117","type":"text","category":"traffic","chapter":5,"jp":"消火栓から三メートルの場所なら、車を離れて客を迎えに行っても駐車違反にならない。","mm":"မီးသတ်ရေပေးပေါက်မှ သုံးမီတာအကွာတွင် ကားထားခဲ့ပြီး ခရီးသည်သွားခေါ်လျှင် ကားရပ်ထားမှု စည်းကမ်းမချိုးဖောက်ပါ။","answer":false,"explanationJP":"消火栓から五メートル以内は駐車禁止である。","explanationMM":"မီးသတ်ရေပေးပေါက်မှ ငါးမီတာအတွင်း ကားရပ်ထားခွင့် မရှိပါ။"},{"id":"N118","type":"text","category":"traffic","chapter":5,"jp":"坂の頂上付近では、前の車が遅くても追越しをしてはいけない。","mm":"တောင်တက်လမ်း ထိပ်အနီးတွင် ရှေ့ကားနှေးလည်း ကျော်မတက်ရပါ။","answer":true,"explanationJP":"頂上付近は対向交通を見通しにくい追越し禁止場所である。","explanationMM":"လမ်းထိပ်အနီးတွင် ဆန့်ကျင်ဘက်ယာဉ်ကို မမြင်ရလွယ်သဖြင့် ကျော်တက်ခွင့် ပိတ်ထားသည်။"},{"id":"N119","type":"text","category":"traffic","chapter":5,"jp":"後車に追い越されている間は、早く追越しを終わらせるために加速する。","mm":"နောက်ကားက မိမိကို ကျော်တက်နေစဉ် မြန်မြန်ကျော်ပြီးစေရန် မိမိက အရှိန်တင်ရသည်။","answer":false,"explanationJP":"追越しが終わるまで速度を増してはいけない。","explanationMM":"ကျော်တက်မှု မပြီးမချင်း မိမိအရှိန်ကို မတိုးရပါ။"},{"id":"N120","type":"text","category":"traffic","chapter":5,"jp":"オートマチック車では、平らな道でもＤに入れたままブレーキを離すと車が動き出すことがある。","mm":"အော်တိုကားကို D ထားပြီး ဘရိတ်လွှတ်လျှင် လမ်းပြန့်ပေါ်မှာပင် ကားစရွေ့နိုင်သည်။","answer":true,"explanationJP":"クリープ現象があるため、停止中はブレーキを確実に踏む。","explanationMM":"ကားအလိုအလျောက် တရွေ့ရွေ့ သွားနိုင်သဖြင့် ရပ်နေချိန် ဘရိတ်ကို သေချာနင်းထားရသည်။"},{"id":"N121","type":"text","category":"traffic","chapter":5,"jp":"バックするときは、カメラに人が映っていなければ車の左右を見る必要はない。","mm":"နောက်ဆုတ်ချိန် ကင်မရာ၌ လူမပေါ်လျှင် ကားဘယ်ညာကို ကြည့်ရန် မလိုပါ။","answer":false,"explanationJP":"カメラの範囲外も自分で確認する。","explanationMM":"ကင်မရာမမြင်နိုင်သော နေရာကိုလည်း ကိုယ်တိုင် စစ်ဆေးရသည်။"},{"id":"N122","type":"text","category":"traffic","chapter":5,"jp":"追越しのために進路を変える前には、後車がすでに自分を追い越そうとしていないか確かめる。","mm":"ကျော်တက်ရန် လမ်းကြောင်းမပြောင်းမီ နောက်ကားက မိမိကို ကျော်တက်နေပြီလား စစ်ဆေးရသည်။","answer":true,"explanationJP":"後車が先に追越しを始めていると危険である。","explanationMM":"နောက်ကားက အရင်စကျော်နေပါက လမ်းကြောင်းပြောင်းခြင်း အန္တရာယ်ရှိသည်။"},{"id":"N123","type":"text","category":"traffic","chapter":5,"jp":"運行中の路線バスが停留所から発進の合図をした。急ブレーキなどを必要としないときは、その発進を妨げない。","mm":"လိုင်းကားက မှတ်တိုင်မှထွက်ရန် အချက်ပြသည်။ မိမိက ရုတ်တရက် ဘရိတ်အုပ်ရခြင်းမျိုး မလိုလျှင် ၎င်းထွက်ခွာမှုကို မပိတ်ဆို့ရပါ။","answer":true,"explanationJP":"無理のない減速でバスが発進できるようにする。","explanationMM":"အန္တရာယ်မရှိဘဲ အရှိန်လျှော့နိုင်လျှင် ဘတ်စ်ကားထွက်နိုင်ရန် လမ်းပေးရသည်။"},{"id":"N124","type":"text","category":"traffic","chapter":1,"jp":"道路に寝そべって通行を妨げる行為は、車の少ない時間でも許されない。","mm":"ယာဉ်နည်းသည့် အချိန်ဖြစ်လည်း လမ်းပေါ်လှဲလျောင်းပြီး သွားလာမှုကို ပိတ်ဆို့ခွင့် မရှိပါ။","answer":true,"explanationJP":"交通を妨げるように道路で寝そべってはいけない。","explanationMM":"သူတစ်ပါး သွားလာ၍မရအောင် လမ်းပေါ် လှဲမနေရပါ။"},{"id":"N125","type":"text","category":"traffic","chapter":1,"jp":"赤信号で左折できる標示板がある場所では、歩行者に注意して左折できる。","mm":"မီးနီချိန် ဘယ်ကွေ့ခွင့်ပြသည့် သီးသန့်ဆိုင်းဘုတ်ရှိလျှင် လမ်းသွားသူကို သတိပြုပြီး ဘယ်ကွေ့နိုင်သည်။","answer":true,"explanationJP":"左折可の標示板があっても、歩行者などの通行を妨げてはいけない。","explanationMM":"ဘယ်ကွေ့ခွင့်ဆိုင်းဘုတ်ရှိလည်း လမ်းသွားသူတို့ကို မပိတ်ဆို့ရပါ။"},{"id":"N126","type":"text","category":"expressway","chapter":7,"jp":"高速道路に入る前には、次の給油場所まで足りる燃料があるか確認する。","mm":"အမြန်လမ်းမဝင်မီ နောက်တစ်ကြိမ် ဆီဖြည့်နိုင်မည့်နေရာအထိ ဆီလုံလောက်သလား စစ်ရသည်။","answer":true,"explanationJP":"本線での燃料切れを防ぐため、出発前に残量と給油場所を確認する。","explanationMM":"လမ်းမပေါ် ဆီပြတ်ခြင်းကို ကာကွယ်ရန် ခရီးမစမီ ဆီလက်ကျန်နှင့် ဆီဆိုင်နေရာကို စစ်ရသည်။"},{"id":"N127","type":"text","category":"expressway","chapter":7,"jp":"高速道路の加速車線では、本線の交通に合わせられるよう速度を調整する。","mm":"အမြန်လမ်း အရှိန်ယူလမ်းကြော၌ အဓိကလမ်းကြော၏ ယာဉ်စီးဆင်းမှုနှင့် ကိုက်ညီအောင် အရှိန်ညှိရသည်။","answer":true,"explanationJP":"速度差を小さくして安全な間隔を選んで合流する。","explanationMM":"အရှိန်ကွာဟချက်ကို လျှော့ပြီး ဘေးကင်းလောက်သော နေရာလွတ်၌ ဝင်ပေါင်းရသည်။"},{"id":"N128","type":"text","category":"expressway","chapter":7,"jp":"高速道路へ合流するときは、合図を出した車が本線の車より優先される。","mm":"အမြန်လမ်းသို့ ဝင်ပေါင်းချိန် အချက်ပြထားသော ကားက ပင်မလမ်းကြောရှိ ကားထက် ဦးစားပေးခံရသည်။","answer":false,"explanationJP":"合流する側は本線を通行する車の進行を妨げてはいけない。","explanationMM":"ဝင်ပေါင်းသည့်ဘက်က ပင်မလမ်းကြောရှိကား၏ သွားလာမှုကို မပိတ်ဆို့ရပါ။"},{"id":"N129","type":"text","category":"expressway","chapter":7,"jp":"高速道路の出口に減速車線があるときは、そこに入ってから十分に速度を落とす。","mm":"အမြန်လမ်းအထွက်၌ အရှိန်လျှော့လမ်းကြောရှိလျှင် ထိုလမ်းကြောဝင်ပြီးမှ အရှိန်ကို လုံလောက်စွာ လျှော့ရသည်။","answer":true,"explanationJP":"後続車に注意して減速車線に移り、出口のカーブに備える。","explanationMM":"နောက်ကားကို သတိပြုပြီး အရှိန်လျှော့လမ်းကြောထဲ ဝင်ကာ အထွက်လမ်းအကွေ့အတွက် ပြင်ဆင်ရသည်။"},{"id":"N130","type":"text","category":"expressway","chapter":7,"jp":"高速道路の出口を通り過ぎたら、路肩を使って分岐までバックしてよい。","mm":"အမြန်လမ်းအထွက် ကျော်သွားလျှင် လမ်းပခုံးမှ နောက်ဆုတ်ပြီး လမ်းခွဲဆီ ပြန်သွားနိုင်သည်။","answer":false,"explanationJP":"後退せずに次の出口まで進む。","explanationMM":"နောက်မဆုတ်ဘဲ နောက်အထွက်အထိ ဆက်သွားရသည်။"},{"id":"N131","type":"text","category":"expressway","chapter":7,"jp":"高速道路が渋滞していても、普通のタクシーは客を急いで送るために路肩を走ってはいけない。","mm":"အမြန်လမ်းကားပိတ်နေလည်း သာမန်တက္ကစီသည် ခရီးသည်ကို အမြန်ပို့ရန် လမ်းပခုံးပေါ်မှ မမောင်းရပါ။","answer":true,"explanationJP":"路肩は渋滞を追い抜くための走行場所ではない。","explanationMM":"လမ်းပခုံးကို ကားတန်းကျော်ရန် အသုံးမပြုရပါ။"},{"id":"N132","type":"text","category":"expressway","chapter":7,"jp":"高速道路の本線では、乗客に景色を撮らせるためなら短時間停車してよい。","mm":"အမြန်လမ်း ပင်မလမ်းကြော၌ ခရီးသည်ကို ရှုခင်းဓာတ်ပုံရိုက်စေရန် ခဏရပ်ပေးနိုင်သည်။","answer":false,"explanationJP":"撮影は本線に停車できる理由にならない。","explanationMM":"ဓာတ်ပုံရိုက်ခြင်းသည် ပင်မလမ်းကြောပေါ် ရပ်ရန် ခွင့်ပြုထားသည့် အကြောင်းရင်း မဟုတ်ပါ။"},{"id":"N133","type":"text","category":"expressway","chapter":7,"jp":"高速道路で故障し路肩に止めたら、後続車に注意し、乗客とともにガードレールの外など安全な場所に避難する。","mm":"အမြန်လမ်းတွင် ကားပျက်၍ လမ်းပခုံးပေါ် ရပ်ပြီးလျှင် နောက်ကားကို သတိပြုပြီး ခရီးသည်နှင့်အတူ အကာအရံအပြင်ဘက်ကဲ့သို့ ဘေးကင်းရာသို့ ရွှေ့ရသည်။","answer":true,"explanationJP":"停止車両に後続車が衝突する危険があるため、車内で救援を待たない。","explanationMM":"နောက်ကားက ဝင်တိုက်နိုင်သဖြင့် ကားထဲတွင် အကူအညီ မစောင့်ရပါ။"},{"id":"N134","type":"text","category":"expressway","chapter":7,"jp":"高速道路で追越しを終えた後も、空いていれば追越車線をそのまま走り続けてよい。","mm":"အမြန်လမ်း၌ ကျော်တက်ပြီးနောက် လမ်းရှင်းနေလျှင် ကျော်တက်လမ်းကြောထဲ ဆက်တိုက်မောင်းနိုင်သည်။","answer":false,"explanationJP":"追越しを終えたら安全を確認して走行車線へ戻る。","explanationMM":"ကျော်တက်ပြီးလျှင် ဘေးကင်းကြောင်း စစ်ကာ ပုံမှန်မောင်းနှင်သည့် လမ်းကြောသို့ ပြန်ဝင်ရသည်။"},{"id":"N135","type":"text","category":"expressway","chapter":7,"jp":"ＥＴＣレーンは開閉バーが開く予定なので、時速三十キロのまま入ってよい。","mm":"ETC လမ်းကြောရှိ တံခါးတံ တက်ပေးမည်ဖြစ်၍ တစ်နာရီ ၃၀ ကီလိုမီတာနှုန်းဖြင့် ဝင်နိုင်သည်။","answer":false,"explanationJP":"時速二十キロ以下で進入し、前車が止まっても対 const chapterCounts = {1:13, 4:6, 5:30, 6:9, 7:8, 9:20, 10:3, 11:1};
function makeExam(){
  const text = [];

    const pool = allText.filter(q => q.chapter === Number(chapter));
    if (pool.length < count) throw new Error('Insufficient questions for chapter ' + chapter);

  }
  return [...pick(text, text.length), ...pick(allScenes, 5)].map(q => q.id);

 const bike=(x,y)=>`<g transform="translate(${x},${y})"><circle cx="-25" cy="20" r="16" fill="none" stroke="#1d252b" stroke-width="5"/><circle cx="30" cy="20" r="16" fill="none" stroke="#1d252b" stroke-width="5"/><path d="M-25 20 L-2 -3 L12 20 Z M12 20 L30 20 L22 -15" fill="none" stroke="#d33b51" stroke-width="5"/>${person(5,-19)}</g>`;
 const van=(x,y)=>`<g transform="translate(${x},${y})"><rect width="154" height="64" rx="9" fill="#e9edf2" stroke="#566a7b" stroke-width="4"/><rect x="15" y="12" width="112" height="23" fill="#4f95b7"/><circle cx="28" cy="64" r="10" fill="#252b2d"/><circle cx="120" cy="64" r="10" fill="#252b2d"/></g>`;
 if(kind==='crosswalk'){for(let i=0;i<6;i++)overlay+=`<rect x="${362+i*23}" y="64" width="15" height="139" fill="#f0efe9"/>`;overlay+=person(413,92)}
 else if(kind==='bicycle'){overlay=bike(390,175)+'<text x="320" y="240" fill="#101820" font-size="18">左折前・左側の自転車</text><path d="M335 176 L305 176" stroke="#ffe866" stroke-width="6" stroke-dasharray="9 7"/>'}
 else if(kind==='door'){overlay=bike(380,168)+'<path d="M293 153 L329 120" stroke="#ffcb68" stroke-width="7"/><path d="M285 153 L304 153 L330 120" stroke="#f66173" stroke-width="5" fill="none"/>'}
 else if(kind==='rain'){overlay='<rect width="600" height="278" fill="#122648" opacity=".48"/>';for(let i=0;i<22;i++)overlay+=`<path d="M${(i*37)%590} ${65+(i*7)%150} l-13 22" stroke="#4daff3" stroke-width="3" opacity=".75"/>`;overlay+='<circle cx="532" cy="41" r="16" fill="#f2dc9a"/>'}
 else if(kind==='school'){overlay='<rect x="395" y="5" width="100" height="52" fill="#e4c4a2"/><text x="446" y="36" text-anchor="middle" font-size="19" fill="#413b36">学校</text>'+'<g transform="translate(433,190) scale(.68)">'+person(0,0)+'</g>'}
 else if(kind==='emergency'){overlay='<path d="M405 0h115v278H405z" fill="#39434f"/><path d="M462 0v62m0 145v71" stroke="#e4dfb7" stroke-width="4" stroke-dasharray="13 10"/>'+van(375,112)+'<rect x="425" y="104" width="34" height="15" rx="3" fill="#ea5263"/><text x="451" y="138" font-size="13" fill="#cc354c">救急車</text>'}
 else if(kind==='blindspot'){overlay=person(513,90)+van(355,70)}
 else if(kind==='busstop'){overlay=van(369,67)+'<text x="410" y="118" font-size="18" fill="#152938">路線バス</text>'+person(480,180)+'<rect x="542" y="23" width="6" height="88" fill="#5b6268"/><circle cx="545" cy="22" r="18" fill="#edc846"/>'}
 else if(kind==='hospital'){overlay='<rect x="396" y="0" width="132" height="56" fill="#d7e9ed"/><text x="447" y="36" font-size="29" fill="#db4b56">＋</text>'+person(413,157)+'<path d="M426 173l16 41" stroke="#433420" stroke-width="5"/>'}
 else if(kind==='night'){overlay='<path d="M365 54V27l27-20 27 20v27zm62 0V30l23-18 23 18v24z" fill="#d8c4aa"/><rect x="0" y="0" width="600" height="278" fill="#0d1e41" opacity=".55"/>'+bike(420,164)+'<circle cx="531" cy="24" r="16" fill="#fbf0bb"/>'}
 return `<svg class="illustration" role="img" aria-label="危険予測イラスト" viewBox="0 0 600 278" xmlns="http://www.w3.org/2000/svg">${base}${overlay}</svg>`;
}
function render(shouldScroll=true){const p=$('#examView');p.classList.add('open');const qid=state.questions[state.i],isc=qid.startsWith('I'),q=isc?mapScenes.get(qid):mapText.get(qid),value=state.answers[state.i],t=totals();if(!q){p.innerHTML='<p>Question data missing</p>';return}
 let content;if(isc){const items=inDisplayOrder(q,(x,j,position)=>`<div class="scenario-item"><h4>${position+1}. ${fmt(x.jp)}</h4>${showMyanmar?`<p>${escapeHTML(x.mm)}</p>`:''}<div class="smallanswers"><button class="answer ${value[j]===true?'selected':''}" data-sub="${j}" data-choice="true">〇 正しい</button><button class="answer ${value[j]===false?'selected':''}" data-sub="${j}" data-choice="false">✕ 誤り</button></div></div>`).join('');content=`<div class="qnumber">Q${state.i+1} · イラスト危険予測 · 2点</div><div class="qtext">${fmt(q.title)}</div>${showMyanmar?`<div class="qmm">${escapeHTML(q.mm)}</div>`:''}${sceneSvg(q.kind)}<p class="meta">イラスト1問につき3つの〇✕すべて正解で2点。</p><div class="scenario-list">${items}</div>`}
 else content=`<div class="qnumber">Q${state.i+1} · ○ / × · 1点 · ${escapeHTML(bank.categories[q.category][0])}</div><div class="qtext">${fmt(q.jp)}</div>${showMyanmar?`<div class="qmm">${escapeHTML(q.mm)}</div>`:''}<div class="answers"><button class="answer ${value===true?'selected':''}" data-choice="true">〇 正しい</button><button class="answer ${value===false?'selected':''}" data-choice="false">✕ 誤り</button></div>`;
 const studyFeedback=state.mode==='study'&&value!==null&&!isc?`<div class="feedback ${value===q.answer?'':'bad'}"><b>${value===q.answer?'✓ 正解':'✕ 不正解'} · ${q.answer?'〇':'✕'}</b>${fmt(q.explanationJP)}<br>${escapeHTML(q.explanationMM)}</div>`:'';
 p.innerHTML=`<div class="exam-shell"><div class="examtoolbar"><div class="flex"><button class="back" id="closeExam">✕ 閉じる</button><span class="examtype">🚕 普通第二種免許 · ${state.mode==='exam'?'模擬試験':'学習'}</span></div><span class="timer ${state.mode==='study'?'study':''}" id="licenseTimer">${clockText()}</span></div><div class="progressarea"><div class="progressinfo"><span>問題 ${state.i+1} / ${state.questions.length}</span><span>回答済み ${t} / ${state.questions.length}</span></div><div class="progress"><i style="width:${(state.i+1)/state.questions.length*100}%"></i></div></div><div class="examquestion"><div class="inlineopts"><label><input type="checkbox" id="rubyToggle" ${furigana?'checked':''}> ふりがな</label><label><input type="checkbox" id="myToggle" ${showMyanmar?'checked':''}> Myanmar</label><span class="meta">${state.mode==='exam'?'Auto Save · この端末のみ':'学習モード'}</span></div>${content}${studyFeedback}<div class="footeract"><button id="prevQ" class="ctrl" ${state.i===0?'disabled':''}>← 前へ</button><div class="flex"><button class="ctrl ${state.i<state.questions.length-1?'primary':''}" id="nextQ">${state.i===state.questions.length-1?'結果を見る':'次へ →'}</button><button class="ctrl subtle" id="submitExam">${state.mode==='exam'?'試験を提出':'学習を終了'}</button></div></div></div></div>`;
 $('#rubyToggle').onchange=e=>{furigana=e.target.checked;render(false)};$('#myToggle').onchange=e=>{showMyanmar=e.target.checked;render(false)};$('#closeExam').onclick=()=>{if(confirm('試験画面を閉じますか？\nBrowser ထဲမှာ အဖြေတွေသိမ်းထားပါမယ်။')){$('#examView').classList.remove('open');$('#examIntro').hidden=false;if(clock)clearInterval(clock)}};$('#prevQ').onclick=()=>{state.i--;save();render()};$('#nextQ').onclick=()=>{if(state.i<state.questions.length-1){state.i++;save();render()}else submit(false)};$('#submitExam').onclick=()=>submit(false);
 for(const b of p.querySelectorAll('[data-choice]'))b.onclick=()=>{if(state.mode==='exam'&&Date.now()>=state.deadline){submit(true);return}const val=b.dataset.choice==='true',sub=b.dataset.sub;if(sub===undefined){state.answers[state.i]=val}else{state.answers[state.i][Number(sub)]=val;}save();render(false)};
 if(shouldScroll)p.scrollIntoView({behavior:'smooth',block:'start'});startClock();}
function scoreExam(){let score=0,wrong=[],textHits=0,sceneHits=0;state.questions.forEach((id,i)=>{const isScene=id.startsWith('I'),q=isScene?mapScenes.get(id):mapText.get(id),v=state.answers[i];let ok;if(isScene)ok=q.statements.every((s,j)=>s.answer===v[j]);else ok=q.answer===v;if(ok){score+=isScene?2:1;if(isScene)sceneHits++;else textHits++}else wrong.push({i,id,q,v,isScene})});return {score,wrong,textHits,sceneHits}}
function submit(auto=false){if(!state||state.completed)return;const unanswered=state.answers.filter(x=>!answered(x)).length;if(!auto&&!confirm(`未回答 ${unanswered} 問があります。提出しますか？\nမဖြေထားတဲ့မေးခွန်း ${unanswered} ခုရှိပါတယ်။ တင်မလား?`))return;
 clearInterval(clock);state.completed=true;if(state.mode==="exam")clearSave();const {score,wrong,textHits,sceneHits}=scoreExam(),study=state.mode==='study',pass=!study&&score>=90,max=study?state.questions.length:100;
 const review=wrong.map(({i,q,v,isScene})=>{let detail='';if(isScene){detail=inDisplayOrder(q,(s,j,position)=>`<p>${position+1}. ${fmt(s.jp)}<br><span lang="my">${escapeHTML(s.mm)}</span> · <b>正解 ${s.answer?'〇':'✕'}</b> / あなた ${v[j]===null?'未回答':v[j]?'〇':'✕'}</p><p class="why">${fmt(s.explanationJP)}<br>${escapeHTML(s.explanationMM)}</p>`).join('')}else{detail=`<p class="mm">${escapeHTML(q.mm)}</p><p>正解 <b>${q.answer?'〇':'✕'}</b> / あなた <b>${v===null?'未回答':v?'〇':'✕'}</b></p><p class="why">${fmt(q.explanationJP)}<br>${escapeHTML(q.explanationMM)}</p>`;}return `<article class="review-item"><b>Q${i+1} · ${isScene?'イラスト':'文章'}</b><h4>${fmt(q.jp||q.title)}</h4>${detail}</article>`}).join('');
 $('#examView').innerHTML=`<div class="exam-shell result"><div class="eyebrow">RESULT · 🚕 普通第二種免許</div><div class="score">${score}<span style="font-size:21px;color:#aaa">/${max}</span></div>${study?'<div class="resulttag">学習モード完了</div>':`<div class="resulttag ${pass?'':'fail'}">${pass?'PASS · 合格':'FAIL · 不合格'}</div>`}<div class="stats"><div class="stat"><b>${textHits}</b><small>文章正解</small></div><div class="stat"><b>${sceneHits}</b><small>イラスト正解</small></div><div class="stat"><b>${wrong.length}</b><small>要復習</small></div></div><p class="mm">${study?'သင်ယူမှု ပြီးဆုံးပါပြီ။':'အောင်မှတ် 90 / 100 · အစစ်စာမေးပွဲ မဟုတ်ပါ။'}</p><div class="flex" style="justify-content:center;margin:22px 0"><button class="ctrl primary" id="retryExam">↻ 新しい Random Exam</button><button class="ctrl" id="reviewToggle">間違えた問題を見る (${wrong.length})</button><button class="ctrl subtle" id="backCards">Card に戻る</button></div><section class="review" id="reviewList" hidden>${review||'<p>間違えた問題はありません。</p>'}</section></div>`;
 $('#retryExam').onclick=()=>start('exam',true);$('#reviewToggle').onclick=()=>{$('#reviewList').hidden=!$('#reviewList').hidden};$('#backCards').onclick=()=>{$('#examView').classList.remove('open');location.href='/mock-exams.html'};$('#examView').scrollIntoView({behavior:'smooth',block:'start'});}
$('#startSecond').onclick=()=>start('exam',false);
$('#studySecond').onclick=()=>start('study',true);
// END: standalone QA preview. No fetch(), no API calls, no production data writes.
</script>
<script>
const captions = {
 my:['အစမ်းစာမေးပွဲ စတင် / ဆက်ဖြေရန်','လေ့ကျင့်ရန်','စာမေးပွဲစင်တာ'],
 en:['Start / resume exam','Study mode','Exam Center'],
 ja:['模擬試験を開始・再開','学習モード','試験一覧']
};
function setLang(lang,button){
 if(!Object.hasOwn(captions,lang))return;
 document.documentElement.lang=lang;
 const [startLabel,studyLabel,centerLabel]=captions[lang];
 $('#startSecond').textContent=startLabel;
 $('#studySecond').textContent=studyLabel;
 $('.intro-back').textContent='← '+centerLabel;
 for(const option of document.querySelectorAll('.lang-switch button')){
   option.classList.toggle('active',option===button);
 }
 for(const label of document.querySelectorAll('[data-'+lang+']')){
   label.textContent=label.getAttribute('data-'+lang);
 }
 try{localStorage.setItem('yk_lang',lang)}catch{}
}
let language='my';
try{language=localStorage.getItem('yk_lang')||'my'}catch{}
const languages=['my','en','ja'];
if(!languages.includes(language))language='my';
setLang(language,document.querySelectorAll('.lang-switch button')[languages.indexOf(language)]);
</script></body></html>
